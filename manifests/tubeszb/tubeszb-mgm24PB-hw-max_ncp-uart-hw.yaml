# Stack defaults follow Nabu Casa; UART routing and baud rate are TubeZB-specific.
name: TubesZB MGM24PB HW Max Zigbee
device: MGM240PB32VNN
base_project: src/zigbee_ncp
sdk: gecko_sdk:4.5.0
toolchain: 12.2.1.20221205
filename: '{manifest_name}_{ezsp_version}_{baudrate}'
gbl:
  fw_type: zigbee_ncp
  ezsp_version: dynamic
  baudrate: 115200
sdk_extension:
- id: xncp
  vendor: nabucasa
  version: 1.0.0
- id: xncp_common
  vendor: nabucasa
  version: 1.0.0
- id: board_activity
  vendor: nabucasa
  version: 1.0.0
add_components:
- id: xncp_core
  vendor: nabucasa
  package: xncp
- id: xncp_common_commands
  vendor: nabucasa
  package: xncp_common
- id: simple_led
  instance:
  - board_activity
- id: board_activity_led
  vendor: nabucasa
  package: board_activity
c_defines:
  XNCP_MFG_MANUF_NAME: '"TubesZB"'
  XNCP_MFG_BOARD_NAME: '"TubesZB MGM24PB HW Max Zigbee"'
  XNCP_BUILD_STRING: template:"{now:%Y%m%d%H%M%S}"
  XNCP_MANUAL_SOURCE_ROUTE_TABLE_SIZE: 200
  EMBER_APS_UNICAST_MESSAGE_COUNT: 32
  EMBER_BINDING_TABLE_SIZE: 32
  EMBER_BROADCAST_TABLE_SIZE: 64
  EMBER_KEY_TABLE_SIZE: 12
  EMBER_MAX_END_DEVICE_CHILDREN: 32
  EMBER_PACKET_BUFFER_COUNT: 255
  EMBER_SOURCE_ROUTE_TABLE_SIZE: 200
  EMBER_CHILD_TABLE_SIZE:
    type: c_flag
    value: 32
  EMBER_ROUTE_TABLE_SIZE:
    type: c_flag
    value: 250
  SL_IOSTREAM_USART_VCOM_BAUDRATE: 115200
  SL_IOSTREAM_USART_VCOM_FLOW_CONTROL_TYPE: usartHwFlowControlCtsAndRts
  SL_IOSTREAM_USART_VCOM_RX_BUFFER_SIZE: 128
  SL_IOSTREAM_USART_VCOM_PERIPHERAL: USART0
  SL_IOSTREAM_USART_VCOM_PERIPHERAL_NO: 0
  SL_IOSTREAM_USART_VCOM_TX_PORT: gpioPortA
  SL_IOSTREAM_USART_VCOM_TX_PIN: 6
  SL_IOSTREAM_USART_VCOM_RX_PORT: gpioPortA
  SL_IOSTREAM_USART_VCOM_RX_PIN: 5
  SL_IOSTREAM_USART_VCOM_CTS_PORT: gpioPortA
  SL_IOSTREAM_USART_VCOM_CTS_PIN: 7
  SL_IOSTREAM_USART_VCOM_RTS_PORT: gpioPortA
  SL_IOSTREAM_USART_VCOM_RTS_PIN: 8
  SL_RAIL_UTIL_PTI_MODE: RAIL_PTI_MODE_DISABLED
  SL_SIMPLE_LED_BOARD_ACTIVITY_POLARITY: SL_SIMPLE_LED_POLARITY_ACTIVE_LOW
  SL_SIMPLE_LED_BOARD_ACTIVITY_PORT: gpioPortD
  SL_SIMPLE_LED_BOARD_ACTIVITY_PIN: 2
  BOARD_ACTIVITY_LED_INSTANCE: sl_led_board_activity
